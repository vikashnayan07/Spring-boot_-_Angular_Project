# Local-only development profile.
# Keeps the VM/office datasource in application.properties untouched.
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/machcare?currentSchema=dev}
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${LOCAL_JWT_SECRET:MachCare-Local-Development-Only-Secret-32B}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=dev
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
server.port=${SERVER_PORT:8082}
